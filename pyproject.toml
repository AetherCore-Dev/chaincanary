[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipguard"
version = "0.1.0"
description = "A pip installation security sandbox that detects supply chain attacks before they compromise your system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "pipguard contributors" }
]
keywords = ["security", "supply-chain", "pip", "sandbox", "malware-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "docker>=6.0",
    "packaging>=23.0",
    "pkginfo>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
pipguard = "pipguard.cli:main"

[project.urls]
Homepage = "https://github.com/allenenli/pipguard"
Repository = "https://github.com/allenenli/pipguard"
Issues = "https://github.com/allenenli/pipguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["pipguard"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = false
