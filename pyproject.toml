[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipguard"
version = "0.1.0"
description = "Security scanner for Python packages — detects supply chain attacks before they execute"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
  { name = "pipguard contributors" },
]
keywords = [
  "security",
  "supply-chain",
  "pypi",
  "malware",
  "package-security",
  "devops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "click>=8.0",
  "requests>=2.28",
  "rich>=13.0",
  "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/allenenli/pipguard"
Repository = "https://github.com/allenenli/pipguard"
Issues = "https://github.com/allenenli/pipguard/issues"
Changelog = "https://github.com/allenenli/pipguard/blob/main/CHANGELOG.md"

[project.scripts]
pipguard = "pipguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pipguard"]

[tool.hatch.build.targets.sdist]
include = [
  "pipguard/",
  "tests/",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
