name: 'chaincanary — Python Supply Chain Security Scanner'
description: >
  Scan Python packages for supply chain attacks before they execute.
  The only tool with .pth semantic analysis — catches attacks like LiteLLM 1.82.7
  that every other scanner misses. No account. No data upload. Zero config.
author: 'chaincanary contributors'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  requirements:
    description: 'Path to requirements file (requirements.txt, pyproject.toml, etc.)'
    required: false
    default: 'requirements.txt'
  fail-on:
    description: 'Fail the workflow if any package hits this verdict (MALICIOUS or HIGH_RISK)'
    required: false
    default: 'MALICIOUS'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  extra-packages:
    description: 'Space-separated list of extra packages to scan (e.g. "litellm==1.82.7")'
    required: false
    default: ''
  sarif-output:
    description: 'Path to write SARIF output for GitHub Code Scanning (e.g. chaincanary.sarif). Leave empty to skip.'
    required: false
    default: ''

outputs:
  result:
    description: 'Audit result summary (PASSED or FAILED)'
    value: ${{ steps.scan.outputs.result }}
  risky-packages:
    description: 'JSON array of packages that failed the audit'
    value: ${{ steps.scan.outputs.risky_packages }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install chaincanary
      shell: bash
      run: |
        pip install chaincanary --quiet

    - name: Run audit
      id: scan
      shell: bash
      env:
        INPUT_REQUIREMENTS: ${{ inputs.requirements }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        set +e

        FAIL_FLAG=""
        if [ "$INPUT_FAIL_ON" = "HIGH_RISK" ]; then
          FAIL_FLAG="--fail-on HIGH_RISK"
        fi

        # Scan requirements file
        if [ -f "$INPUT_REQUIREMENTS" ]; then
          chaincanary audit "$INPUT_REQUIREMENTS" $FAIL_FLAG --json-output > audit_result.json
          AUDIT_EXIT=$?
        else
          echo "Warning: $INPUT_REQUIREMENTS not found, skipping file audit"
          echo '{"results":[]}' > audit_result.json
          AUDIT_EXIT=0
        fi

        # Generate SARIF from the same audit (no second scan)
        if [ -n "$INPUT_SARIF_OUTPUT" ] && [ -f "$INPUT_REQUIREMENTS" ]; then
          chaincanary audit "$INPUT_REQUIREMENTS" --sarif-output > "$INPUT_SARIF_OUTPUT"
        fi

        # Scan extra packages
        EXTRA_EXIT=0
        if [ -n "$INPUT_EXTRA_PACKAGES" ]; then
          for pkg in $INPUT_EXTRA_PACKAGES; do
            echo "Scanning extra package: $pkg"
            chaincanary check "$pkg" || EXTRA_EXIT=$?
          done
        fi

        # Determine overall result
        FINAL_EXIT=$((AUDIT_EXIT + EXTRA_EXIT))

        if [ $FINAL_EXIT -ne 0 ]; then
          echo "result=FAILED" >> $GITHUB_OUTPUT
          # Extract risky packages from JSON
          RISKY=$(python3 -c "
        import json, sys
        data = json.load(open('audit_result.json'))
        risky = [r for r in data.get('results', []) if r.get('verdict') in ('MALICIOUS','HIGH_RISK')]
        print(json.dumps([r['package'] + '==' + r['version'] for r in risky]))
        " 2>/dev/null || echo "[]")
          echo "risky_packages=$RISKY" >> $GITHUB_OUTPUT
        else
          echo "result=PASSED" >> $GITHUB_OUTPUT
          echo "risky_packages=[]" >> $GITHUB_OUTPUT
        fi

        # Print the audit table (pretty, for CI logs)
        if [ -f audit_result.json ]; then
          python3 -c "
        import json, sys
        data = json.load(open('audit_result.json'))
        results = data.get('results', [])
        risky = [r for r in results if r['verdict'] not in ('SAFE', 'LOW_RISK', 'UNKNOWN')]
        if risky:
            print(f'\n⚠️  {len(risky)} package(s) failed security audit:')
            for r in risky:
                print(f'  {r[\"package\"]}=={r[\"version\"]}  →  {r[\"verdict\"]} (score: {r[\"score\"]})')
                for f in r.get(\"findings\", [])[:3]:
                    print(f'      [{f[\"severity\"]}] {f[\"title\"]}')
        else:
            print(f'\n✅ All {len(results)} packages passed security audit.')
        " 2>/dev/null
        fi

        exit $FINAL_EXIT
