name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for GitHub Release
  id-token: write   # for PyPI trusted publishing (OIDC)

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi   # requires PyPI trusted publisher setup

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI (trusted publishing, no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## chaincanary ${{ github.ref_name }}

            ### Install
            ```bash
            pip install chaincanary==${{ github.ref_name }}
            ```

            ### Quick scan
            ```bash
            chaincanary check litellm latest
            chaincanary audit requirements.txt
            ```

            See [CHANGELOG.md](CHANGELOG.md) for what's new.
