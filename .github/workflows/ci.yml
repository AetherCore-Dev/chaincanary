name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run daily to catch newly-flagged packages
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Lint
        if: matrix.python-version == '3.11'
        run: |
          pip install ruff
          ruff check pipguard/ --select E,F,I

  # pipguard scans its own dependencies — dogfooding
  self-scan:
    name: Self-audit (pipguard scans itself)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipguard
        run: pip install -e .

      # pipguard audits its own requirements
      - name: Audit runtime dependencies
        run: |
          pip freeze | grep -E "^(click|requests|rich|packaging)==" > /tmp/runtime_deps.txt
          cat /tmp/runtime_deps.txt
          pipguard audit /tmp/runtime_deps.txt --fail-on MALICIOUS

  build:
    name: Build & check package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check wheel contents
        run: |
          pip install check-wheel-contents
          check-wheel-contents dist/*.whl

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
